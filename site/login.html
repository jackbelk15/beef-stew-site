<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Client Login | The Beef-Stew Co.</title>
    <link rel="stylesheet" href="assets/site.css?v=4">
    <script defer src="assets/portal.js?v=4">
    </script>
  </head>
  <body class="portal-body">
    <main class="portal-panel">
      <a class="brand" href="index.html">
        <span class="seal">B&amp;S</span>
        <span>
          <b>The Beef-Stew Co.</b>
          <small>Client Services</small>
        </span>
      </a>
      <p class="eyebrow dark">Authorized Access</p>
      <h1>Client login</h1>
      <p>Enter the current access phrase to continue.</p>
      <form class="portal-form" id="login-form">
        <label for="password">Access phrase</label>
        <input id="password" type="password" autocomplete="off" autofocus required>
        <button type="submit">Continue</button>
        <div class="portal-error" id="error">
        </div>
      </form>
      <p class="portal-note">Access is limited to parties with an established interest in stew.</p>
    </main>
  </body>
</html>
